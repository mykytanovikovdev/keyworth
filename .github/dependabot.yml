version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them: compromised versions are
    # usually caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Majors held back on purpose; revisit when the reason no longer applies.
    ignore:
      # Node types must match the Node major we run (.nvmrc), or the types
      # allow APIs that do not exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript <6.1 only; TypeScript 7 has no
      # stable compiler API for it yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Their Firefox crashes the page when a label is looked up after an axe
      # scan (microsoft/playwright#43967), which fails our axe tests. Fixed on
      # Playwright's main; remove this entry once a release with the fix is out.
      # A Playwright update also needs the matching Docker image and digests in
      # scripts/browser-server.ts, which Dependabot does not change.
      - dependency-name: "@playwright/test"
        versions: ["1.65.0", "1.65.1"]
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
