name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches, never on main (a deploy may be running).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Lint, types, tests, licenses, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI directly, pinned by checksum, instead of a third-party action.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  deploy:
    name: Deploy to Cloudflare
    # Only from main, and only after every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait for the new version
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # Without the URL, Playwright would silently test a local build instead.
          test -n "$PRODUCTION_URL" || { echo "::error::Set the PRODUCTION_URL repository variable"; exit 1; }
          for attempt in $(seq 1 12); do
            curl -sSf -o /dev/null "$PRODUCTION_URL/api/health" && exit 0
            sleep 5
          done
          echo "::error::$PRODUCTION_URL/api/health did not respond"; exit 1
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: npx playwright test --project=headers --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
